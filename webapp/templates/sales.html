{% extends "base.html" %}
{% block title %}Sales — Smart E-Commerce{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fa-solid fa-chart-line"></i> Sales Analytics</h1>
    <p class="subtitle">Deep dive into revenue, categories, cities and payments</p>
</div>

<div class="grid-2">
    <div class="chart-card">
        <h2><i class="fa-solid fa-trophy"></i> Top 10 Categories</h2>
        <div id="catChart" style="height:400px;"></div>
    </div>
    <div class="chart-card">
        <h2><i class="fa-solid fa-city"></i> Top 10 Cities</h2>
        <div id="cityChart" style="height:400px;"></div>
    </div>
</div>

<div class="grid-2">
    <div class="chart-card">
        <h2><i class="fa-solid fa-credit-card"></i> Payment Methods</h2>
        <div id="payChart" style="height:400px;"></div>
    </div>
    <div class="chart-card">
        <h2><i class="fa-solid fa-star"></i> Review Scores</h2>
        <div id="revChart" style="height:400px;"></div>
    </div>
</div>

<script>
    const plotlyLayout = {
        margin: { t: 20, l: 150, r: 20, b: 40 },
        plot_bgcolor: "rgba(0,0,0,0)",
        paper_bgcolor: "rgba(0,0,0,0)",
        font: { family: "Inter, sans-serif" },
    };

    const cats = {{ top_cats | tojson }};
    Plotly.newPlot("catChart", [{
        x: cats.map(d => d.revenue).reverse(),
        y: cats.map(d => d.category).reverse(),
        type: "bar", orientation: "h",
        marker: {
            color: cats.map(d => d.revenue).reverse(),
            colorscale: [[0, "#a7f3d0"], [0.5, "#10b981"], [1, "#047857"]],
        }
    }], plotlyLayout, { responsive: true });

    const cities = {{ top_cities | tojson }};
    Plotly.newPlot("cityChart", [{
        x: cities.map(d => d.revenue).reverse(),
        y: cities.map(d => d.city).reverse(),
        type: "bar", orientation: "h",
        marker: {
            color: cities.map(d => d.revenue).reverse(),
            colorscale: [[0, "#fecaca"], [0.5, "#f87171"], [1, "#b91c1c"]],
        }
    }], plotlyLayout, { responsive: true });

    const pays = {{ payments | tojson }};
    Plotly.newPlot("payChart", [{
        labels: pays.map(d => d.payment_type),
        values: pays.map(d => d.total),
        type: "pie", hole: 0.45,
        marker: {
            colors: ["#6366f1", "#8b5cf6", "#ec4899", "#f59e0b", "#10b981"],
        }
    }], { ...plotlyLayout, margin: { t: 20 } }, { responsive: true });

    const reviews = {{ reviews | tojson }};
    Plotly.newPlot("revChart", [{
        x: reviews.map(d => d.review_score),
        y: reviews.map(d => d.total),
        type: "bar",
        marker: {
            color: reviews.map(d => d.total),
            colorscale: [[0, "#fecaca"], [0.5, "#fbbf24"], [1, "#10b981"]],
        }
    }], { ...plotlyLayout, margin: { t: 20, l: 60 } }, { responsive: true });
</script>
{% endblock %}
